<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bloblox IA</title>
    <style>
        body { background-color: #1e1e2f; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; background: #2b2b3d; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .chat-box { height: 300px; overflow-y: auto; border: 1px solid #444; padding: 10px; margin-bottom: 10px; border-radius: 5px; background: #1a1a24; }
        input { width: 75%; padding: 10px; border: none; border-radius: 5px; }
        button { width: 20%; padding: 10px; background: #5865F2; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2>Bloblox IA</h2>
        <div class="chat-box" id="chatBox">
            <p><b>Bloblox:</b> ¡Hola! ¿En qué te puedo ayudar hoy?</p>
        </div>
        <div style="display: flex; justify-content: space-between;">
            <input type="text" id="userInput" placeholder="Escribe tu mensaje...">
            <button onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <script>
        function enviarMensaje() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            if(input.value.trim() !== "") {
                chatBox.innerHTML += `<p><b>Tú:</b> ${input.value}</p>`;
                input.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
