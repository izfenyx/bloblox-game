<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloblox IA - Discord Activity</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            background: #181b24;
            border: 1px solid #2d3343;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 900px;
            max-width: 95vw;
            height: 550px;
            max-height: 90vh;
            overflow: hidden;
        }

        /* Panel Izquierdo: Avatar */
        .avatar-panel {
            flex: 1;
            background: linear-gradient(135deg, #1f2430 0%, #13161f 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            border-right: 1px solid #2d3343;
            position: relative;
        }

        .ai-name {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: #7289da;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .avatar-container {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #7289da;
            box-shadow: 0 0 20px rgba(114, 137, 218, 0.3);
            background: #2d3343;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .avatar-container.speaking {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(114, 137, 218, 0.6);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.05s ease-in-out;
        }

        #imgOpen {
            opacity: 0;
        }

        .avatar-container.speaking #imgClosed {
            opacity: 0;
        }

        .avatar-container.speaking #imgOpen {
            opacity: 1;
        }

        .status-indicator {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #a0aec0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #48bb78;
            border-radius: 50%;
            box-shadow: 0 0 8px #48bb78;
        }

        /* Panel Derecho: Chat */
        .chat-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            background: #181b24;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .message.ai {
            background: #252a37;
            color: #e2e8f0;
            align-self: flex-start;
            border-left: 4px solid #7289da;
        }

        .message.user {
            background: #7289da;
            color: #ffffff;
            align-self: flex-end;
        }

        .chat-input-area {
            padding: 20px;
            background: #13161f;
            border-top: 1px solid #2d3343;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: #1f2430;
            border: 1px solid #2d3343;
            border-radius: 8px;
            padding: 12px 15px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #7289da;
        }

        button {
            background: #7289da;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #5b6eae;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Panel Izquierdo: Avatar con tus imágenes -->
        <div class="avatar-panel">
            <div class="ai-name">Bloblox IA</div>
            <div class="avatar-container" id="avatarBox">
                <img id="imgClosed" src="boca-cerrada.png" alt="Avatar Boca Cerrada">
                <img id="imgOpen" src="boca-abierta.png" alt="Avatar Boca Abierta">
            </div>
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span id="statusText">Lista para hablar</span>
            </div>
        </div>

        <!-- Panel Derecho: Chat -->
        <div class="chat-panel">
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">¡Hola! Soy Bloblox IA, tu asistente de voz. ¿En qué te puedo ayudar hoy?</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Escribe tu mensaje..." autocomplete="off">
                <button id="sendBtn">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const avatarBox = document.getElementById('avatarBox');
        const statusText = document.getElementById('statusText');

        let mouthInterval = null;

        function startMouthAnimation() {
            avatarBox.classList.add('speaking');
            statusText.textContent = 'Hablando...';
            let isOpen = false;
            if (mouthInterval) clearInterval(mouthInterval);
            mouthInterval = setInterval(() => {
                isOpen = !isOpen;
                const imgClosed = document.getElementById('imgClosed');
                const imgOpen = document.getElementById('imgOpen');
                if (isOpen) {
                    imgClosed.style.opacity = '0';
                    imgOpen.style.opacity = '1';
                } else {
                    imgClosed.style.opacity = '1';
                    imgOpen.style.opacity = '0';
                }
            }, 150);
        }

        function stopMouthAnimation() {
            if (mouthInterval) clearInterval(mouthInterval);
            avatarBox.classList.remove('speaking');
            document.getElementById('imgClosed').style.opacity = '1';
            document.getElementById('imgOpen').style.opacity = '0';
            statusText.textContent = 'Lista para hablar';
        }

        // Sistema de voz en la nube ultra-natural con voz 100% femenina garantizada
        function speakText(text) {
            startMouthAnimation();

            // Codificamos el texto para enviarlo de forma segura por URL al sintetizador en línea
            const encodedText = encodeURIComponent(text);
            // Usamos un servicio público de TTS en streaming con voz femenina predeterminada en español (es-ES-ElviraNeural o similar)
            const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=es&client=tw-ob`;

            const audio = new Audio(audioUrl);
            
            audio.play().catch(() => {
                // Si el navegador bloquea el autoplay por restricciones de usuario, intentamos respaldo local
                fallbackLocalSpeech(text);
            });

            audio.onended = () => {
                stopMouthAnimation();
            };

            audio.onerror = () => {
                fallbackLocalSpeech(text);
            };
        }

        // Respaldo por si acaso la red falla: fuerza tonos agudos extremos en navegador
        function fallbackLocalSpeech(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.1;
                utterance.pitch = 2.0; // Tono ultra alto para forzar voz de mujer/niña
                
                let voices = window.speechSynthesis.getVoices();
                let spanishVoice = voices.find(v => v.lang.startsWith('es') && !v.name.toLowerCase().includes('pablo') && !v.name.toLowerCase().includes('raul'));
                if (spanishVoice) utterance.voice = spanishVoice;

                utterance.onstart = () => startMouthAnimation();
                utterance.onend = () => stopMouthAnimation();
                utterance.onerror = () => stopMouthAnimation();

                window.speechSynthesis.speak(utterance);
            } else {
                stopMouthAnimation();
            }
        }

        // Generador de respuestas inteligentes y variadas
        function getAIResponse(userText) {
            const text = userText.toLowerCase();

            if (text.includes('hola') || text.includes('saludos') || text.includes('buenas')) {
                return "¡Hola! Qué gusto saludarte por aquí en la actividad de Discord. ¿En qué te puedo colaborar?";
            } else if (text.includes('minecraft') || text.includes('servidor') || text.includes('lovelycraft')) {
                return "¡Ah, hablemos de Minecraft! Tu servidor está configurado y listado correctamente. ¿Necesitas ayuda con algún plugin o ajuste?";
            } else if (text.includes('vrchat') || text.includes('avatar')) {
                return "VRChat es genial para personalizar avatares y mundos. ¿Estás trabajando en algún proyecto o mundo nuevo por ahí?";
            } else if (text.includes('quién eres') || text.includes('que eres') || text.includes('como te llamas')) {
                return "Soy Bloblox IA, tu asistente virtual integrada en esta actividad de Discord para ayudarte con tus proyectos y mantener charlas divertidas.";
            } else if (text.includes('gracias') || text.includes('excelente') || text.includes('perfecto')) {
                return "¡De nada! Para eso estoy aquí. Avísame si necesitas configurar algo más en la web.";
            } else if (text.includes('ayuda') || text.includes('comandos')) {
                return "Puedo charlar contigo, responder dudas sobre programación, juegos o servidores. ¡Escribe lo que quieras y te respondo!";
            } else {
                const options = [
                    "Interesante punto de vista. Cuéntame más al respecto.",
                    "Entendido perfectamente. ¿Hay algo más en lo que te pueda apoyar por aquí?",
                    "¡Vaya! Eso suena genial. ¿Cómo planeas desarrollarlo?",
                    "Estoy procesando lo que me dices, ¡me encanta aprender cosas nuevas de ti!",
                    "Claro que sí, toma eso en cuenta para optimizarlo al máximo."
                ];
                return options[Math.floor(Math.random() * options.length)];
            }
        }

        function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            chatMessages.appendChild(userMsg);
            
            userInput.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            setTimeout(() => {
                const aiResponseText = getAIResponse(text);

                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';
                aiMsg.textContent = aiResponseText;
                chatMessages.appendChild(aiMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                speakText(aiResponseText);
            }, 600);
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSendMessage();
            }
        });

        window.addEventListener('load', () => {
            setTimeout(() => {
                speakText("¡Hola! Soy Bloblox IA, tu asistente de voz. ¿En qué te puedo ayudar hoy?");
            }, 1000);
        });
    </script>
</body>
</html>
