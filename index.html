<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloblox IA - Discord Activity</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            background: #181b24;
            border: 1px solid #2d3343;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 900px;
            max-width: 95vw;
            height: 550px;
            max-height: 90vh;
            overflow: hidden;
        }

        /* Panel Izquierdo: Avatar */
        .avatar-panel {
            flex: 1;
            background: linear-gradient(135deg, #1f2430 0%, #13161f 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            border-right: 1px solid #2d3343;
            position: relative;
        }

        .ai-name {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: #7289da;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .avatar-container {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #7289da;
            box-shadow: 0 0 20px rgba(114, 137, 218, 0.3);
            background: #2d3343;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .avatar-container.speaking {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(114, 137, 218, 0.6);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.05s ease-in-out;
        }

        #imgOpen {
            opacity: 0;
        }

        .avatar-container.speaking #imgClosed {
            opacity: 0;
        }

        .avatar-container.speaking #imgOpen {
            opacity: 1;
        }

        .status-indicator {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #a0aec0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #48bb78;
            border-radius: 50%;
            box-shadow: 0 0 8px #48bb78;
        }

        /* Panel Derecho: Chat */
        .chat-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            background: #181b24;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .message.ai {
            background: #252a37;
            color: #e2e8f0;
            align-self: flex-start;
            border-left: 4px solid #7289da;
        }

        .message.user {
            background: #7289da;
            color: #ffffff;
            align-self: flex-end;
        }

        .chat-input-area {
            padding: 20px;
            background: #13161f;
            border-top: 1px solid #2d3343;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: #1f2430;
            border: 1px solid #2d3343;
            border-radius: 8px;
            padding: 12px 15px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #7289da;
        }

        button {
            background: #7289da;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #5b6eae;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Panel Izquierdo: Avatar con tus imágenes -->
        <div class="avatar-panel">
            <div class="ai-name">Bloblox IA</div>
            <div class="avatar-container" id="avatarBox">
                <img id="imgClosed" src="boca-cerrada.png" alt="Avatar Boca Cerrada">
                <img id="imgOpen" src="boca-abierta.png" alt="Avatar Boca Abierta">
            </div>
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span id="statusText">Lista para hablar</span>
            </div>
        </div>

        <!-- Panel Derecho: Chat -->
        <div class="chat-panel">
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">¡Hola! Soy Bloblox IA, tu asistente de voz. ¿En qué te puedo ayudar hoy?</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Escribe tu mensaje..." autocomplete="off">
                <button id="sendBtn">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const avatarBox = document.getElementById('avatarBox');
        const statusText = document.getElementById('statusText');

        let mouthInterval = null;

        function startMouthAnimation() {
            avatarBox.classList.add('speaking');
            statusText.textContent = 'Hablando...';
            let isOpen = false;
            if (mouthInterval) clearInterval(mouthInterval);
            mouthInterval = setInterval(() => {
                isOpen = !isOpen;
                const imgClosed = document.getElementById('imgClosed');
                const imgOpen = document.getElementById('imgOpen');
                if (isOpen) {
                    imgClosed.style.opacity = '0';
                    imgOpen.style.opacity = '1';
                } else {
                    imgClosed.style.opacity = '1';
                    imgOpen.style.opacity = '0';
                }
            }, 150);
        }

        function stopMouthAnimation() {
            if (mouthInterval) clearInterval(mouthInterval);
            avatarBox.classList.remove('speaking');
            document.getElementById('imgClosed').style.opacity = '1';
            document.getElementById('imgOpen').style.opacity = '0';
            statusText.textContent = 'Lista para hablar';
        }

        // Reproduce el audio Base64 enviado por el servidor Node.js
        function playAudioResponse(audioBase64) {
            if (!audioBase64) {
                stopMouthAnimation();
                return;
            }

            startMouthAnimation();
            const audio = new Audio(audioBase64);

            audio.play().catch(err => {
                console.error("Error al reproducir audio:", err);
                stopMouthAnimation();
            });

            audio.onended = () => {
                stopMouthAnimation();
            };

            audio.onerror = () => {
                stopMouthAnimation();
            };
        }

        // Petición real al backend de Node.js (OpenAI + gTTS)
        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Mostrar mensaje del usuario
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            chatMessages.appendChild(userMsg);
            
            userInput.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Indicador temporal de carga
            statusText.textContent = 'Pensando...';

            try {
                const response = await fetch('http://localhost:3000/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();

                if (data.error) {
                    console.error("Error del servidor:", data.error);
                    statusText.textContent = 'Lista para hablar';
                    return;
                }

                // Mostrar respuesta de la IA en el chat
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';
                aiMsg.textContent = data.text;
                chatMessages.appendChild(aiMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                // Reproducir el audio externo generado por el servidor
                playAudioResponse(data.audioBase64);

            } catch (error) {
                console.error("Error de conexión con el servidor:", error);
                statusText.textContent = 'Lista para hablar';
            }
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSendMessage();
            }
        });
    </script>
</body>
</html>
